spring:
  application:
    name: support_ticket_management_platform

  datasource:
    url: jdbc:postgresql://localhost:5432/support_ticket_db
    username: ${DB_USERNAME:support_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
